name: Apply premium visual polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire premium UI assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          changed = False
          css = '<link rel="stylesheet" href="/premium-ui.css">'
          js = '<script src="/premium-ui.js" defer></script>'
          if '/premium-ui.css' not in html:
              html = html.replace('</head>', css + '</head>', 1)
              changed = True
          if '/premium-ui.js' not in html:
              html = html.replace('</body>', js + '</body>', 1)
              changed = True
          if changed:
              p.write_text(html, encoding='utf-8')

      - name: Verify premium assets
        shell: bash
        run: |
          test -s public/assets/sequence-fantasy-background.svg
          test -s public/assets/sequence-avatars.svg
          test -s public/premium-ui.css
          test -s public/premium-ui.js

      - name: Commit premium deployment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/premium-ui.css public/premium-ui.js public/assets/sequence-fantasy-background.svg public/assets/sequence-avatars.svg
          git diff --cached --quiet && exit 0
          git commit -m "Deploy premium fantasy UI assets"
          git push
