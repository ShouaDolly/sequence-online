name: Apply premium visual polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire premium assets into static HTML
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          changed = False
          css = '<link rel="stylesheet" href="/premium-ui.css">'
          js = '<script src="/premium-ui.js" defer></script>'
          if '/premium-ui.css' not in html:
              html = html.replace('</head>', css + '</head>', 1)
              changed = True
          if '/premium-ui.js' not in html:
              html = html.replace('</body>', js + '</body>', 1)
              changed = True
          if changed:
              p.write_text(html, encoding='utf-8')

      - name: Make Worker inject premium assets too
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/worker.js')
          s = p.read_text(encoding='utf-8')
          old = 'if(url.pathname==="/")return env.ASSETS.fetch(new Request(new URL("/index.html",request.url),request));'
          new = 'if(url.pathname==="/"){const res=await env.ASSETS.fetch(new Request(new URL("/index.html",request.url),request));if(!res.ok)return res;const html=await res.text();const headers=new Headers(res.headers);headers.set("content-type","text/html; charset=UTF-8");const decorated=html.replace("</head>","<link rel=\\"stylesheet\\" href=\\"/premium-ui.css\\"></head>").replace("</body>","<script src=\\"/premium-ui.js\\" defer></script></body>");return new Response(decorated,{status:res.status,headers})}'
          if old in s and 'const decorated=html.replace("</head>"' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

      - name: Verify assets
        shell: bash
        run: |
          test -s public/assets/sequence-fantasy-background.svg
          test -s public/assets/sequence-avatars.svg
          test -s public/premium-ui.css
          test -s public/premium-ui.js
          node --check public/premium-ui.js

      - name: Commit premium deployment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html src/worker.js public/premium-ui.css public/premium-ui.js public/assets/sequence-fantasy-background.svg public/assets/sequence-avatars.svg
          git diff --cached --quiet && exit 0
          git commit -m "Deploy premium fantasy UI and viewport fix"
          git push
