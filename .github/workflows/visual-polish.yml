name: Apply premium visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install fantasy background asset and responsive game CSS
        shell: python
        env:
          BACKGROUND_B64: "__BACKGROUND_B64__"
        run: |
          from pathlib import Path
          import base64

          bg = base64.b64decode("".join("${BACKGROUND_B64}".split()))
          out = Path('public/assets/sequence-fantasy-background.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(bg)

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          /* Premium fantasy tabletop background */
          html,body{background:#06142e url('/assets/sequence-fantasy-background.webp') center center / cover fixed no-repeat !important;}
          body{min-height:100svh;}
          .app{background:rgba(5,18,42,.34)!important;box-shadow:none!important;backdrop-filter:blur(.5px);}
          .page{background:transparent!important;}
          .game{background:transparent!important;}
          .panel{backdrop-filter:blur(8px);}

          /* Deep, smooth game buttons */
          .primary,.btn,.icon,.host-controls button,.actionbar button,.finish,.undo,.hint,.emoji-trigger,.emoji-opt{
            position:relative;
            overflow:hidden;
            transform:translateY(0);
            transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,border-color .16s ease;
            will-change:transform;
          }
          .primary:before,.btn:before,.icon:before,.host-controls button:before,.actionbar button:before,.finish:before,.undo:before,.hint:before,.emoji-trigger:before,.emoji-opt:before{
            content:"";position:absolute;left:8%;right:8%;top:7%;height:34%;border-radius:999px;
            background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));
            pointer-events:none;
          }
          .primary,.btn,.host-controls button,.icon{box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -3px 0 rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.28);}
          .primary:hover,.btn:hover,.icon:hover,.host-controls button:hover,.actionbar button:hover,.finish:hover,.undo:hover,.hint:hover,.emoji-trigger:hover,.emoji-opt:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.2),0 12px 24px rgba(0,0,0,.34);}
          .primary:active,.btn:active,.icon:active,.host-controls button:active,.actionbar button:active,.finish:active,.undo:active,.hint:active,.emoji-trigger:active,.emoji-opt:active{transform:translateY(2px);filter:brightness(.98);box-shadow:inset 0 2px 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.26);}
          .finish{box-shadow:inset 0 1px 0 rgba(255,255,255,.48),inset 0 -4px 0 rgba(120,71,0,.23),0 10px 22px rgba(129,84,12,.35)!important;}
          .finish.ready{animation:premiumPulse 1.25s ease-in-out infinite;}
          @keyframes premiumPulse{50%{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(120,71,0,.2),0 0 0 5px rgba(239,197,93,.16),0 14px 28px rgba(129,84,12,.42)!important}}
          .undo,.hint{box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -3px 0 rgba(0,0,0,.24),0 8px 18px rgba(0,0,0,.3)!important;}

          /* Desktop: keep the entire board and action row in the viewport */
          @media(min-width:760px){
            html,body{overflow:hidden!important;}
            .app{width:min(100vw,1500px);min-height:100dvh;}
            .page{height:calc(100dvh - 64px);padding:8px 12px;overflow:hidden;}
            .game{height:100%;min-height:0;display:grid!important;grid-template-rows:auto auto minmax(0,1fr) auto!important;gap:6px;overflow:hidden;padding-left:188px!important;}
            .player-strip{top:38px!important;left:0!important;width:174px!important;max-height:calc(100dvh - 240px)!important;overflow:auto!important;}
            .board-wrap{min-height:0!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;}
            .board{width:min(calc(100% - 10px),calc(100dvh - 315px))!important;height:min(calc(100% - 10px),calc(100dvh - 315px))!important;aspect-ratio:1/1!important;}
            .hand{height:158px!important;min-height:158px!important;position:relative!important;bottom:auto!important;overflow:visible!important;display:flex!important;flex-direction:column!important;}
            .hand-head{flex:0 0 20px!important;min-height:20px!important;}
            .cards{height:94px!important;min-height:94px!important;overflow:visible!important;align-items:flex-end!important;}
            .cardhand{flex-basis:68px!important;width:68px!important;height:94px!important;margin:0 -11px!important;}
            .cardhand .suit{font-size:22px!important;margin-top:4px!important;}
            .cardhand .jack img{height:45px!important;}
            .actionbar{height:40px!important;min-height:40px!important;display:grid!important;grid-template-columns:1fr 1.6fr 1fr!important;gap:8px!important;}
            .actionbar button{height:40px!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:50!important;}
          }

          /* Mobile: preserve the excellent portrait layout while using the same art direction */
          @media(max-width:759px){
            html,body{overflow-x:hidden;}
            .app{background:rgba(5,18,42,.2)!important;}
            .page{padding-bottom:8px!important;}
            .board-wrap{box-shadow:0 16px 34px rgba(0,8,28,.44)!important;}
            .hand{box-shadow:0 -12px 34px rgba(0,7,30,.52)!important;}
          }
          '''

          marker='/* Premium fantasy tabletop background */'
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit premium visual polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/assets/sequence-fantasy-background.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add fantasy background and 3D game controls"
          git push
