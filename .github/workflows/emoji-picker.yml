name: Apply Sequence+ UI fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emoji-picker.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix desktop hand and action controls
        shell: python
        run: |
          from pathlib import Path

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
          /* Desktop game-table fix: keep the action buttons visible. */
          @media(min-width:760px){
            .game{grid-template-rows:29px 50px 28px minmax(0,1fr) 150px !important;}
            .game .hand{
              height:150px !important;
              min-height:150px !important;
              overflow:visible !important;
              display:flex !important;
              flex-direction:column !important;
            }
            .game .hand-head{flex:0 0 18px !important;}
            .game .cards{
              flex:1 1 auto !important;
              min-height:72px !important;
              height:76px !important;
              overflow:visible !important;
            }
            .game .actionbar{
              display:grid !important;
              grid-template-columns:1fr 1.6fr 1fr !important;
              flex:0 0 38px !important;
              height:38px !important;
              min-height:38px !important;
              visibility:visible !important;
              position:relative !important;
              z-index:50 !important;
            }
            .game .actionbar button{
              display:block !important;
              visibility:visible !important;
              opacity:1 !important;
              position:relative !important;
              z-index:51 !important;
            }
            .game .board{
              width:min(100%,calc(100dvh - 272px)) !important;
            }
          }
          '''

          marker = '/* Desktop game-table fix: keep the action buttons visible. */'
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit desktop fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix desktop Finish Turn visibility"
          git push
